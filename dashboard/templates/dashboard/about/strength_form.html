{% extends 'dashboard/base.html' %}
{% block content %}
<div style="max-width:640px;">
  <div style="margin-bottom:20px;">
    <a href="{% url 'dashboard:strengths_list' %}" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Back to Strengths
    </a>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">{{ page_title }}</span></div>
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input type="text" name="title" class="form-control"
              value="{{ obj.title|default:'' }}" required
              placeholder="e.g. Proven Operational Expertise"/>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4"
              placeholder="Decades of hands-on experience…">{{ obj.description|default:'' }}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Icon Class <span class="text-muted">(FontAwesome)</span></label>
            <input type="text" name="icon" class="form-control"
              value="{{ obj.icon|default:'' }}" placeholder="fa-solid fa-star"/>
          </div>
          <div class="form-group">
            <label class="form-label">Accordion Image</label>
            {% if obj.image %}
            <div style="margin-bottom:10px;">
              <img src="{{ obj.image.url }}"
                style="max-width:220px;border-radius:8px;border:1px solid var(--border);"/>
            </div>
            {% endif %}
            <input type="file" name="image" class="form-control" accept="image/*"/>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Order</label>
              <input type="number" name="order" class="form-control"
                value="{{ obj.order|default:'0' }}"/>
            </div>
            <div class="form-group" style="padding-top:28px;">
              <div class="form-check">
                <input type="checkbox" name="is_active" id="is_active"
                  {% if obj.is_active or not obj %}checked{% endif %}/>
                <label for="is_active">Active (visible on website)</label>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:10px;padding-top:8px;">
            <button type="submit" class="btn btn-primary" style="padding:12px 28px;">
              <i class="fa-solid fa-floppy-disk"></i>
              {% if obj %}Update Strength{% else %}Add Strength{% endif %}
            </button>
            <a href="{% url 'dashboard:strengths_list' %}" class="btn btn-secondary"
              style="padding:12px 20px;">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
