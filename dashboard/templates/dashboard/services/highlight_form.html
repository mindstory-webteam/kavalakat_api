{% extends 'dashboard/base.html' %}
{% block content %}
<div style="margin-bottom:24px;">
  <a href="{% url 'dashboard:service_detail' service.pk %}?tab=highlights" class="btn btn-secondary btn-sm">← Back to {{ service.name }}</a>
</div>
<div class="card">
  <div class="card-header"><span class="card-title">{{ page_title }}</span></div>
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div class="form-group"><label class="form-label">Section Title</label>
          <input type="text" name="section_title" class="form-control" value="{{ obj.section_title|default:'' }}"/></div>
        <div class="form-group"><label class="form-label">Section Sub Title</label>
          <input type="text" name="section_sub_title" class="form-control" value="{{ obj.section_sub_title|default:'' }}"/></div>
        <div class="form-group"><label class="form-label">Highlight Title *</label>
          <input type="text" name="highlight_title" class="form-control" required value="{{ obj.highlight_title|default:'' }}"/></div>
        <div class="form-group"><label class="form-label">Display Order</label>
          <input type="number" name="display_order" class="form-control" value="{{ obj.display_order|default:0 }}"/></div>
        <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Highlight Description</label>
          <textarea name="highlight_description" class="form-control" rows="4">{{ obj.highlight_description|default:'' }}</textarea></div>
        <div class="form-group"><label class="form-label">Video File</label>
          {% if obj.highlight_video %}<div style="margin-bottom:8px;"><video src="{{ obj.highlight_video.url }}" style="max-height:80px;border-radius:8px;" controls></video></div>{% endif %}
          <input type="file" name="highlight_video" class="form-control" accept="video/*"/></div>
        <div class="form-group" style="padding-top:28px;">
          <div class="form-check" style="display:flex;gap:8px;align-items:center;">
            <input type="checkbox" name="is_active" id="hl_active" {% if obj.is_active %}checked{% endif %}/>
            <label for="hl_active">Active</label>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'dashboard:service_detail' service.pk %}?tab=highlights" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
