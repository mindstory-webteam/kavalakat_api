{% extends 'dashboard/base.html' %}
{% block content %}
<div style="margin-bottom:24px;">
  <a href="{% url 'dashboard:service_detail' service.pk %}?tab=features" class="btn btn-secondary btn-sm">← Back to {{ service.name }}</a>
</div>
<div class="card">
  <div class="card-header"><span class="card-title">{{ page_title }}</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div class="form-group"><label class="form-label">Feature Title *</label>
          <input type="text" name="feature_title" class="form-control" required value="{{ obj.feature_title|default:'' }}"/></div>
        <div class="form-group"><label class="form-label">Order</label>
          <input type="number" name="order" class="form-control" value="{{ obj.order|default:0 }}"/></div>
        <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Feature Description</label>
          <textarea name="feature_description" class="form-control" rows="4">{{ obj.feature_description|default:'' }}</textarea></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'dashboard:service_detail' service.pk %}?tab=features" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
