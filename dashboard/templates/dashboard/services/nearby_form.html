{% extends 'dashboard/base.html' %}
{% block content %}
<div style="margin-bottom:24px;">
  <a href="{% url 'dashboard:service_detail' service.pk %}?tab=location" class="btn btn-secondary btn-sm">← Back to {{ service.name }}</a>
</div>
<div class="card">
  <div class="card-header"><span class="card-title">{{ page_title }}</span></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div class="form-group"><label class="form-label">Place Name *</label>
          <input type="text" name="nearby_place_name" class="form-control" required value="{{ obj.nearby_place_name|default:'' }}"/></div>
        <div class="form-group"><label class="form-label">Distance</label>
          <input type="text" name="distance" class="form-control" value="{{ obj.distance|default:'' }}" placeholder="e.g. 2 km, 500 m"/></div>
        <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Google Maps Link</label>
          <input type="url" name="map_link" class="form-control" value="{{ obj.map_link|default:'' }}" placeholder="https://maps.google.com/…"/></div>
        <div class="form-group"><label class="form-label">Order</label>
          <input type="number" name="order" class="form-control" value="{{ obj.order|default:0 }}"/></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        <a href="{% url 'dashboard:service_detail' service.pk %}?tab=location" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
